---
name: 'build devcontainer'

'on':
  push:
    branches:
      - 'main'
    paths:
      - '.devcontainer/**'
      - '.github/workflows/build-devcontainer.yaml'
  pull_request:
    branches:
      - 'main'
    paths:
      - '.devcontainer/**'
      - '.github/workflows/build-devcontainer.yaml'
  # A path-triggered build alone would never pick up a patched base image, so
  # rebuild weekly as well.
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

env:
  REGISTRY: 'ghcr.io'
  IMAGE_NAME: 'epiforesite/flepimop2-epiworld'

jobs:
  build-and-push:
    name: 'build and push'
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'read'
      packages: 'write'
    steps:
      - name: 'checkout repository'
        uses: 'actions/checkout@v7.0.1'
        with:
          persist-credentials: false
      - name: 'set up docker buildx'
        uses: 'docker/setup-buildx-action@v4'
      - name: 'log in to the container registry'
        if: ${{ github.event_name != 'pull_request' }}
        uses: 'docker/login-action@v4'
        with:
          registry: '${{ env.REGISTRY }}'
          username: '${{ github.actor }}'
          password: '${{ secrets.GITHUB_TOKEN }}'
      - name: 'build image'
        if: ${{ github.event_name == 'pull_request' }}
        uses: 'docker/build-push-action@v7'
        with:
          context: '.'
          file: '.devcontainer/Containerfile'
          push: false
          tags: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:pr-test'
          cache-from: 'type=gha'
          cache-to: 'type=gha,mode=max'
      - name: 'build and push image'
        if: ${{ github.event_name != 'pull_request' }}
        uses: 'docker/build-push-action@v7'
        with:
          context: '.'
          file: '.devcontainer/Containerfile'
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: 'type=gha'
          cache-to: 'type=gha,mode=max'
